---
# cPanel → Git Version Control → Manage → "Deploy HEAD Commit" bunu çalıştırır.
# Klonlamak dosyaları public_html'e KOYMAZ; taşıyan adım budur.
#
# YERLEŞİM: bu pakette alan adının kök dizini değiştirilemiyor, yani her şey
# public_html içinde olmak zorunda. Uygulama public_html/ayparcasi_app/ altına,
# Laravel'in public/ içeriği doğrudan public_html'e gidiyor.
# ayparcasi_app/.htaccess klasörü web'e kapatır — o dosya olmazsa .env okunur.
#
# GÜNLÜK: her adım /home/aypa8479/deploy-son.log dosyasına yazar. Deploy
# takılırsa o dosyayı Dosya Yöneticisi'nden açıp nerede durduğuna bakın;
# cPanel'in kendi günlüğünü aramaya gerek yok.
#
# Kopyalama /bin/cp ile ve dizinler TEK TEK sayılarak yapılıyor: rsync bu
# sunucuda yok, tar da cPanel'in dar PATH'inde bulunamadı. Joker, find ya da
# boru yok — her komut mutlak yolla çağrılıyor ki PATH'e bağlı kalmasın.
#
# Her görev TEK SATIR: cPanel'in YAML ayrıştırıcısı çok satırlı komutlarda
# takılabiliyor. Uzun görünseler de bölmeyin.
#
# Ayrıntılı anlatım: DEPLOY.md
deployment:
  tasks:
    - export WEBROOT=/home/aypa8479/public_html
    - export APPPATH=/home/aypa8479/public_html/ayparcasi_app
    - export PHPBIN=/opt/cpanel/ea-php83/root/usr/bin/php
    - export LOG=/home/aypa8479/deploy-son.log
    - date > $LOG 2>&1
    - echo "APPPATH=$APPPATH WEBROOT=$WEBROOT" >> $LOG 2>&1
    - echo "tar=$(command -v tar) php=$(command -v php) composer=$(command -v composer) rsync=$(command -v rsync)" >> $LOG 2>&1
    - echo "--- 1/7 uygulama dosyalari ---" >> $LOG 2>&1
    - /bin/mkdir -p $APPPATH >> $LOG 2>&1
    - /bin/rm -rf $APPPATH/app $APPPATH/bootstrap/app.php $APPPATH/bootstrap/providers.php $APPPATH/config $APPPATH/database $APPPATH/deploy $APPPATH/public $APPPATH/resources $APPPATH/routes >> $LOG 2>&1
    - /bin/cp -a app artisan bootstrap composer.json composer.lock config database deploy public resources routes .env.production.example $APPPATH/ >> $LOG 2>&1
    - test -d vendor && /bin/cp -a vendor $APPPATH/ >> $LOG 2>&1 || echo "vendor depoda yok - composer calisacak" >> $LOG 2>&1
    - echo "APPPATH icerigi:" >> $LOG 2>&1
    - /bin/ls -1 $APPPATH >> $LOG 2>&1
    - echo "--- 2/7 storage iskeleti ve izinler ---" >> $LOG 2>&1
    - /bin/mkdir -p $APPPATH/storage/framework/cache/data $APPPATH/storage/framework/sessions $APPPATH/storage/framework/views $APPPATH/storage/logs $APPPATH/storage/app/public $APPPATH/bootstrap/cache >> $LOG 2>&1
    - chmod -R 775 $APPPATH/storage $APPPATH/bootstrap/cache >> $LOG 2>&1
    - echo "--- 3/7 klasoru webe kapat ---" >> $LOG 2>&1
    - /bin/cp deploy/cpanel/app.htaccess $APPPATH/.htaccess >> $LOG 2>&1
    - echo "--- 4/7 public icerigi web kokune ---" >> $LOG 2>&1
    - /bin/cp -a public/img public/fonts public/css public/js $WEBROOT/ >> $LOG 2>&1 || true
    - /bin/cp -a public/favicon.ico public/favicon-32.png public/apple-touch-icon.png public/robots.txt $WEBROOT/ >> $LOG 2>&1 || true
    - /bin/rm -rf $WEBROOT/build >> $LOG 2>&1
    - /bin/cp -a public/build $WEBROOT/build >> $LOG 2>&1
    - /bin/cp deploy/cpanel/index.php $WEBROOT/index.php >> $LOG 2>&1
    - /bin/cp public/.htaccess $WEBROOT/.htaccess >> $LOG 2>&1
    - echo "WEBROOT icerigi:" >> $LOG 2>&1
    - /bin/ls -1 $WEBROOT >> $LOG 2>&1
    - echo "--- 5/7 storage bagi ---" >> $LOG 2>&1
    - test -L $WEBROOT/storage || /bin/ln -s $APPPATH/storage/app/public $WEBROOT/storage >> $LOG 2>&1
    - echo "--- 6/7 composer ---" >> $LOG 2>&1
    - cd $APPPATH && command -v composer >/dev/null 2>&1 && composer install --no-dev --no-interaction --prefer-dist --optimize-autoloader >> $LOG 2>&1 || echo "COMPOSER BULUNAMADI - bkz DEPLOY.md 2-E" >> $LOG 2>&1
    - echo "--- 7/7 gocler, onbellek, yonetici ---" >> $LOG 2>&1
    - cd $APPPATH && $PHPBIN artisan migrate --force >> $LOG 2>&1 || echo "MIGRATE ATLANDI - .env ve vendor var mi?" >> $LOG 2>&1
    - cd $APPPATH && $PHPBIN artisan optimize:clear >> $LOG 2>&1 || true
    - cd $APPPATH && $PHPBIN artisan optimize >> $LOG 2>&1 || true
    - cd $APPPATH && $PHPBIN artisan filament:optimize >> $LOG 2>&1 || true
    - cd $APPPATH && $PHPBIN artisan admin:olustur >> $LOG 2>&1 || true
    - echo "=== DEPLOY BITTI ===" >> $LOG 2>&1
    - echo "--- durum dosyasi (gecici teshis) ---" >> $LOG 2>&1
    - export DURUM=$WEBROOT/deploy-durum.txt
    - date > $DURUM 2>&1
    - echo "php=$($PHPBIN -v 2>&1 | head -1)" >> $DURUM 2>&1
    - echo "composer=$(command -v composer)" >> $DURUM 2>&1
    - test -f $APPPATH/.env && echo "ENV: VAR" >> $DURUM 2>&1 || echo "ENV: YOK" >> $DURUM 2>&1
    - test -f $APPPATH/vendor/autoload.php && echo "VENDOR: VAR" >> $DURUM 2>&1 || echo "VENDOR: YOK" >> $DURUM 2>&1
    - test -f $APPPATH/artisan && echo "ARTISAN: VAR" >> $DURUM 2>&1 || echo "ARTISAN: YOK" >> $DURUM 2>&1
    - test -L $WEBROOT/storage && echo "STORAGE BAGI: VAR" >> $DURUM 2>&1 || echo "STORAGE BAGI: YOK" >> $DURUM 2>&1
    - echo "APPPATH:" >> $DURUM 2>&1
    - /bin/ls -1 $APPPATH >> $DURUM 2>&1
    - echo "SON HATA:" >> $DURUM 2>&1
    - /usr/bin/tail -5 $APPPATH/storage/logs/laravel.log >> $DURUM 2>&1 || echo "(laravel.log yok - uygulama hic acilmamis)" >> $DURUM 2>&1
