---
# cPanel → Git Version Control → Manage → "Deploy HEAD Commit" bunu çalıştırır.
# Klonlamak dosyaları public_html'e KOYMAZ; taşıyan adım budur.
#
# YERLEŞİM: bu pakette alan adının kök dizini değiştirilemiyor, yani her şey
# public_html içinde olmak zorunda. Uygulama public_html/ayparcasi_app/ altına,
# Laravel'in public/ içeriği doğrudan public_html'e gidiyor.
# ayparcasi_app/.htaccess klasörü web'e kapatır — o dosya olmazsa .env okunur.
#
# Kopyalama TAR ile yapılıyor, rsync ile değil: paylaşımlı sunucularda rsync
# çoğu zaman kurulu olmuyor ve ilk görevde deploy duruyor. Tar her yerde var.
# Bedeli: silinen dosyalar sunucuda kalır (build/ hariç, orayı temizliyoruz).
#
# Yollar hesap aypa8479'a göre yazıldı. PHPBIN satırını MultiPHP'de seçili
# sürümle eşleyin — proje PHP 8.3+ ister.
#
# Her görev TEK SATIR: cPanel'in YAML ayrıştırıcısı çok satırlı komutlarda
# takılabiliyor. Uzun görünseler de bölmeyin.
#
# Ayrıntılı anlatım: DEPLOY.md
deployment:
  tasks:
    - export WEBROOT=/home/aypa8479/public_html
    - export APPPATH=/home/aypa8479/public_html/ayparcasi_app
    - export PHPBIN=/opt/cpanel/ea-php83/root/usr/bin/php
    - echo "=== 0/7 ortam ==="
    - echo "tar $(command -v tar) | php $(command -v php) | composer $(command -v composer)"
    - /bin/mkdir -p $APPPATH
    - echo "=== 1/7 uygulama dosyalari ==="
    - tar -cf - --exclude=./.git --exclude=./.env --exclude=./storage --exclude=./node_modules --exclude=./tests . | tar -xf - -C $APPPATH
    - echo "=== 2/7 storage iskeleti (varsa dokunulmaz) ve izinler ==="
    - /bin/mkdir -p $APPPATH/storage/framework/cache/data $APPPATH/storage/framework/sessions $APPPATH/storage/framework/views $APPPATH/storage/logs $APPPATH/storage/app/public $APPPATH/bootstrap/cache
    - chmod -R 775 $APPPATH/storage $APPPATH/bootstrap/cache
    - echo "=== 3/7 klasoru webe kapat ==="
    - /bin/cp deploy/cpanel/app.htaccess $APPPATH/.htaccess
    - echo "=== 4/7 public icerigi web kokune ==="
    - tar -cf - -C ./public --exclude=./storage --exclude=./hot --exclude=./build . | tar -xf - -C $WEBROOT
    - /bin/rm -rf $WEBROOT/build
    - /bin/cp -R ./public/build $WEBROOT/build
    - /bin/cp deploy/cpanel/index.php $WEBROOT/index.php
    - /bin/cp public/.htaccess $WEBROOT/.htaccess
    - echo "=== 5/7 storage bagi ==="
    - test -L $WEBROOT/storage || /bin/ln -s $APPPATH/storage/app/public $WEBROOT/storage
    - echo "=== 6/7 composer ==="
    - cd $APPPATH && command -v composer >/dev/null 2>&1 && composer install --no-dev --no-interaction --prefer-dist --optimize-autoloader || echo "COMPOSER BULUNAMADI - bkz DEPLOY.md 2-E"
    - echo "=== 7/7 gocler, onbellek, yonetici ==="
    - cd $APPPATH && $PHPBIN artisan migrate --force || echo "MIGRATE ATLANDI - .env ve vendor var mi?"
    - cd $APPPATH && $PHPBIN artisan optimize:clear || true
    - cd $APPPATH && $PHPBIN artisan optimize || true
    - cd $APPPATH && $PHPBIN artisan filament:optimize || true
    - cd $APPPATH && $PHPBIN artisan admin:olustur || true
    - echo "=== DEPLOY BITTI ==="
