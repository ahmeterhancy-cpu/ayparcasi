---
# cPanel → Git Version Control → "Deploy HEAD Commit" bu dosyayı çalıştırır.
# Komutlar cPanel kullanıcısı olarak, deponun kök dizininde koşar.
#
# YERLEŞİM: bu pakette alan adının kök dizini değiştirilemiyor, yani her şey
# public_html içinde olmak zorunda. Uygulama public_html/ayparcasi_app/ altına,
# Laravel'in public/ içeriği doğrudan public_html'e gidiyor.
# ayparcasi_app/.htaccess klasörü web'e kapatır — o dosya olmazsa .env okunur.
#
# Yollar bu hesaba göre yazıldı (cPanel kullanıcısı: aypa8479).
# PHPBIN satırını MultiPHP'de seçtiğiniz sürümle eşleyin — proje PHP 8.3+ ister.
#
# Ayrıntılı anlatım: DEPLOY.md
deployment:
  tasks:
    - export WEBROOT=/home/aypa8479/public_html
    - export APPPATH=/home/aypa8479/public_html/ayparcasi_app
    - export PHPBIN=/opt/cpanel/ea-php83/root/usr/bin/php

    - /bin/mkdir -p $APPPATH

    # 1) Uygulama dosyaları. public/ de kopyalanır — Vite manifest'i oradan
    #    okunur. .env ve storage/ hariç: biri sunucuya özel ayar, öteki
    #    yüklenen görseller ve günlükler; deploy ikisini de silmemeli.
    - /usr/bin/rsync -a --delete
        --exclude '.git'
        --exclude '.env'
        --exclude 'storage/'
        --exclude 'node_modules/'
        --exclude 'tests/'
        ./ $APPPATH/

    # 2) Klasörü web'e kapat. Bu satır kaybolursa .env dışarıdan okunur.
    - /bin/cp deploy/cpanel/app.htaccess $APPPATH/.htaccess

    # 3) public/ içeriği web köküne. --delete YOK: public_html'de bu projeye
    #    ait olmayan dosyalar da olabilir, onları silmeyelim.
    - /usr/bin/rsync -a --exclude 'storage' --exclude 'build' --exclude 'hot' ./public/ $WEBROOT/

    #    build/ tamamen bize ait, orada --delete güvenli — eski varlık birikmesin
    - /usr/bin/rsync -a --delete ./public/build/ $WEBROOT/build/

    # 4) Giriş dosyası ve yönlendirme kuralları
    - /bin/cp deploy/cpanel/index.php $WEBROOT/index.php
    - /bin/cp public/.htaccess $WEBROOT/.htaccess

    # 5) Yüklenen görseller için sembolik bağ. `artisan storage:link`
    #    KULLANILMAZ — o bağı uygulamanın kendi public/ dizinine kurar,
    #    burada web kökü orası değil.
    - test -L $WEBROOT/storage || /bin/ln -s $APPPATH/storage/app/public $WEBROOT/storage

    # 6) Bağımlılıklar, göçler, önbellek
    - cd $APPPATH && /usr/local/bin/composer install --no-dev --no-interaction --prefer-dist --optimize-autoloader
    - cd $APPPATH && $PHPBIN artisan migrate --force
    - cd $APPPATH && $PHPBIN artisan optimize:clear
    - cd $APPPATH && $PHPBIN artisan optimize
    - cd $APPPATH && $PHPBIN artisan filament:optimize
